# Stack completo con un solo comando:
#   docker compose up -d --build
# Producción multi-GPU con vLLM (LLM_PROVIDER=vllm en .env):
#   docker compose --profile vllm up -d --build
# Sin GPU NVIDIA (notebook de respaldo para la demo):
#   docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d --build
#
# Solo nginx publica un puerto en el host; Redis, Chroma, Ollama, vLLM y la API
# quedan accesibles únicamente dentro de la red interna de Docker.

name: mi-argentina-ia

x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    REDIS_URL: redis://redis:6379/0
    CHROMA_HOST: chroma
    CHROMA_PORT: "8000"
    OLLAMA_BASE_URL: http://ollama:11434
    VLLM_BASE_URL: http://vllm:8000/v1
    WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
  # Endurecimiento del contenedor: sistema de archivos de solo lectura, sin capacidades.
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  # ------------------------------------------------------------------ Caché
  redis:
    image: redis:8.6-alpine
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:-2gb}
      # Solo se desalojan claves con TTL (respuestas, rate limit, locks).
      - --maxmemory-policy
      - volatile-lru
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ------------------------------------------------------------------ Base vectorial
  chroma:
    image: chromadb/chroma:1.5.9
    volumes:
      - chroma-data:/data
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ------------------------------------------------------------------ Modelos (Ollama)
  # Sirve los embeddings siempre y el chat cuando LLM_PROVIDER=ollama.
  ollama:
    <<: *gpu
    image: ollama/ollama:0.34.3
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-8}
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
      OLLAMA_FLASH_ATTENTION: "1"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Descarga los modelos una sola vez (quedan en el volumen ollama-data).
  ollama-init:
    image: ollama/ollama:0.34.3
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.1:8b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ollama pull "$$OLLAMA_EMBED_MODEL" &&
        if [ "$$LLM_PROVIDER" = "ollama" ]; then ollama pull "$$OLLAMA_CHAT_MODEL"; fi
    restart: "no"

  # ------------------------------------------------------------------ Modelos (vLLM, producción)
  vllm:
    <<: *gpu
    profiles: ["vllm"]
    image: vllm/vllm-openai:v0.30.0
    ipc: host
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-cambiar-esta-clave}
    volumes:
      - hf-cache:/root/.cache/huggingface
    command:
      - ${VLLM_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      - --served-model-name
      - ${VLLM_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      - --tensor-parallel-size
      - "${VLLM_TENSOR_PARALLEL_SIZE:-1}"
      - --gpu-memory-utilization
      - "${VLLM_GPU_MEMORY_UTILIZATION:-0.90}"
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - "${VLLM_MAX_NUM_SEQS:-256}"
      # El system prompt es idéntico en todas las consultas: su KV-cache se reutiliza.
      - --enable-prefix-caching
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 900s
    restart: unless-stopped

  # ------------------------------------------------------------------ Ingesta (one-shot)
  ingest:
    <<: *app
    command: ["python", "ingest.py", "--if-empty"]
    depends_on:
      chroma:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    restart: "no"

  # ------------------------------------------------------------------ API (escala horizontal)
  api:
    <<: *app
    deploy:
      replicas: ${API_REPLICAS:-2}
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
    restart: unless-stopped

  # ------------------------------------------------------------------ Balanceador
  nginx:
    image: nginx:1.30-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chroma-data:
  ollama-data:
  hf-cache:
