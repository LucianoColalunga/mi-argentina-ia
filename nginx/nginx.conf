# Balanceador L7 delante de las réplicas de la API.
# En producción se ubica detrás de Cloudflare (ver README, sección "Edge").

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    keepalive_requests 10000;

    # Las consultas son JSON chicos: cualquier cuerpo grande es abuso.
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # DNS interno de Docker: re-resolver "api" permite sumar réplicas con --scale sin reiniciar nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- Detrás de Cloudflare: descomentar para usar la IP real del cliente -----
    # (lista completa y actualizada en https://www.cloudflare.com/ips/)
    # set_real_ip_from 173.245.48.0/20;
    # set_real_ip_from 103.21.244.0/22;
    # set_real_ip_from 104.16.0.0/13;
    # set_real_ip_from 172.64.0.0/13;
    # set_real_ip_from 2400:cb00::/32;
    # real_ip_header CF-Connecting-IP;

    # Segunda barrera de rate limiting por IP (la primera es el edge).
    limit_req_zone $binary_remote_addr zone=chat_per_ip:20m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # Log sin cuerpos ni query strings (privacidad).
    log_format json_min escape=json
        '{"ts":"$time_iso8601","status":$status,"method":"$request_method","path":"$uri",'
        '"rt":$request_time,"urt":"$upstream_response_time","upstream":"$upstream_addr",'
        '"request_id":"$request_id","x_cache":"$upstream_http_x_cache"}';
    access_log /dev/stdout json_min;

    server {
        listen 80 default_server;

        set $api_upstream http://api:8000;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 90s;
        proxy_send_timeout 30s;
        # Si una réplica está caída, reintentar en otra (solo errores de conexión).
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;

        # Métricas solo accesibles desde la red interna (Prometheus scrapea api:8000 directo).
        location = /metrics {
            return 404;
        }

        location /v1/ {
            limit_req zone=chat_per_ip burst=20 nodelay;
            limit_conn conn_per_ip 20;
            proxy_pass $api_upstream;
        }

        location / {
            proxy_pass $api_upstream;
        }
    }
}
